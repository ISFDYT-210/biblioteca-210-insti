<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca Digital{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f7fb; color: #333; }
        .container { max-width: 760px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .page-title { margin-bottom: 20px; color: #004c8c; }
        a { color: #004c8c; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, input[type="submit"] { background: #004c8c; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        button:hover, input[type="submit"]:hover { background: #003b6f; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccd6eb; border-radius: 6px; box-sizing: border-box; }
        .password-wrapper { position: relative; width: 100%; display: block; }
        .password-wrapper input { padding-right: 44px !important; }
        .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: #888; display: flex; align-items: center; }
        .toggle-password:hover { color: #004c8c; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">{% block page_title %}Biblioteca Digital{% endblock %}</h1>
        {% block content %}{% endblock %}
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var eyeOpen = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        var eyeClosed = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        document.querySelectorAll('input[type="password"]').forEach(function(input) {
            var wrapper = document.createElement('div');
            wrapper.className = 'password-wrapper';
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(input);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'toggle-password';
            btn.innerHTML = eyeClosed;
            btn.setAttribute('aria-label', 'Mostrar/ocultar contraseña');
            btn.addEventListener('click', function() {
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = eyeOpen;
                } else {
                    input.type = 'password';
                    btn.innerHTML = eyeClosed;
                }
            });
            wrapper.appendChild(btn);
        });
    });
    </script>
</body>
</html>
