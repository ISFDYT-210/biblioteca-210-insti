<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca Digital{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f7fb; color: #333; }
        .container { max-width: 760px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .page-title { margin-bottom: 20px; color: #004c8c; }
        a { color: #004c8c; text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, input[type="submit"] { background: #004c8c; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        button:hover, input[type="submit"]:hover { background: #003b6f; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccd6eb; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">{% block page_title %}Biblioteca Digital{% endblock %}</h1>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
